<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JDI">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101A48">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; manifest-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>กำลังเปิดพื้นที่ทำงาน... | JDI - Role Intelligence</title>
  <link rel="icon" href="favicon.svg?v=5.0" type="image/svg+xml">
  <link rel="icon" href="favicon-32x32.png?v=5.0" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5.0" sizes="180x180">
  <link rel="manifest" href="site.webmanifest?v=5.0">
  <style>
    :root {
      color-scheme: light;
      --navy: #101a48;
      --pink: #a5127f;
      --paper: #fff;
      --muted: #69718a;
      --line: #dce1ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--navy);
      background:
        radial-gradient(circle at 12% 88%, rgba(165, 18, 127, .12), transparent 34%),
        radial-gradient(circle at 88% 10%, rgba(16, 26, 72, .11), transparent 38%),
        #f7f8fc;
      font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
    }
    main {
      width: min(620px, 100%);
      padding: clamp(32px, 6vw, 56px);
      border: 1px solid var(--line);
      border-top: 5px solid var(--pink);
      border-radius: 26px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(16, 26, 72, .13);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      text-align: left;
    }
    .brand img { width: 66px; height: 66px; }
    .brand strong { display: block; font-size: 20px; letter-spacing: -.02em; }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
    .loader {
      width: 52px;
      height: 52px;
      margin: 0 auto 24px;
      border: 5px solid #e8eaf3;
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.15; letter-spacing: -.04em; }
    p { margin: 14px auto 0; max-width: 440px; color: var(--muted); font-size: 17px; line-height: 1.7; }
    a {
      display: inline-flex;
      justify-content: center;
      margin-top: 28px;
      padding: 14px 22px;
      border-radius: 12px;
      color: #fff;
      background: var(--pink);
      font-weight: 700;
      text-decoration: none;
    }
    [hidden] { display: none !important; }
    .error .loader { display: none; }
    .error h1 { font-size: 30px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loader { animation-duration: 1.8s; } }
  </style>
</head>
<body>
  <main id="launcher">
    <div class="brand">
      <img src="favicon.svg?v=4.2" alt="JDI">
      <div><strong>JDI - Role Intelligence</strong><span>AI-powered role workspace</span></div>
    </div>
    <div class="loader" aria-hidden="true"></div>
    <h1 id="title">กำลังเปิดพื้นที่ทำงาน...</h1>
    <p id="message">ระบบกำลังพาคุณไปยังพื้นที่ทำงานที่ปลอดภัย กรุณารอสักครู่</p>
    <a id="fallback" href="#" hidden>เปิดพื้นที่ทำงาน</a>
  </main>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var deploymentId = String(params.get('d') || '').trim();
      var mode = String(params.get('mode') || '').trim();
      var email = String(params.get('email') || '').trim();
      var validDeployment = /^[A-Za-z0-9_-]{20,200}$/.test(deploymentId);
      var validMode = !mode || /^(setup|login)$/.test(mode);
      var validEmail = !email || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      if (!validDeployment || !validMode || !validEmail) {
        showError();
        return;
      }

      var target = new URL('https://script.google.com/macros/s/' + deploymentId + '/exec');
      if (mode) target.searchParams.set('mode', mode);
      if (email) target.searchParams.set('email', email);

      var fallback = document.getElementById('fallback');
      fallback.href = target.toString();
      fallback.hidden = false;

      window.setTimeout(function () {
        window.location.replace(target.toString());
      }, 180);

      function showError() {
        var launcher = document.getElementById('launcher');
        launcher.classList.add('error');
        document.getElementById('title').textContent = 'ลิงก์นี้ไม่สมบูรณ์';
        document.getElementById('message').textContent = 'กรุณาเปิดลิงก์ล่าสุดจากอีเมล JDI หรือติดต่อผู้ดูแลระบบ';
        document.getElementById('fallback').hidden = true;
      }
    }());
  </script>
</body>
</html>
